              <script>

                document.getElementById('twitter-login').addEventListener('click', async () => {
                const response = await fetch('http://localhost:3000/auth/twitter/init');
                const { url } = await response.json();
                 window.location.href = url;
                });
                // Function to fetch posts from the server
                let cachedTweets = null;
                let lastFetchTime = 0;

                async function fetchPosts() {
                    const currentTime = Date.now();
                    if (cachedTweets && (currentTime - lastFetchTime < 60000)) { // 1 minute cache
                        return cachedTweets;
                    }
              
                    try {
                        const response = await fetch('http://localhost:3000/api/getPosts');
                        if (!response.ok) {
                            throw new Error('Failed to fetch posts');
                        }
              
                        const posts = await response.json();
                        cachedTweets = posts;
                        lastFetchTime = currentTime;
                        displayPosts(posts);
                    } catch (error) {
                        console.error('Error fetching posts:', error);
                    }
                }
              
                // Function to post a new tweet
                async function postTweet() {
                    const tweetText = document.getElementById('post-input').value;
                    if (!tweetText.trim()) {
                        alert('Tweet cannot be empty!');
                        return;
                    }
              
                    try {
                        const response = await fetch('http://localhost:3000/api/postTweet', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ tweetText }),
                        });
              
                        if (!response.ok) {
                            throw new Error('Failed to post tweet');
                        }
              
                        const newPost = await response.json();
                        console.log('Tweet posted:', newPost);
                        
                        // Optionally, you can fetch the posts again after posting
                        fetchPosts();
                    } catch (error) {
                        console.error('Error posting tweet:', error);
                    }
                }
              
                // Add event listener to the Post button
                document.getElementById('post-btn').addEventListener('click', async () => {
  const text = document.getElementById('post-input').value;

  if (!text) return alert('Tweet cannot be empty');

  try {
    const response = await fetch('http://localhost:3000/api/postTweet', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ tweet: text })
    });

    const data = await response.json();

    if (response.ok) {
      alert('Tweet posted to Twitter!');
      document.getElementById('post-input').value = '';
    } else {
      console.error(data);
      alert('Failed to post tweet');
    }
  } catch (err) {
    console.error(err);
    alert('Error connecting to server');
  }
});
              </script>
