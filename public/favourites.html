<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contra | Favourites</title>
  <link rel="stylesheet" href="homepagestyles.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

  <div class="page-layout">
    <nav>
      <a href="index.html"><i class='bx bx-home'></i> Home</a>
      <a href="following.html"><i class='bx bx-user'></i> Following</a>
      <a href="favourites.html" class="active"><i class='bx bx-heart'></i> Favourites</a>
      <a href="login.html"><i class='bx bx-log-out'></i> Logout</a>
    </nav>

    <div class="main-content">
      <header>💖 Your Favourite Posts</header>

      <section class="feed" id="favorite-feed">
        <p>Loading your favorite posts...</p>
      </section>

      <script type="module" src="homepage.js"></script>
      <script>

        async function fetchAndDisplayFavorites() {
          const response = await fetch('http://localhost:3000/api/getPosts');
          const posts = await response.json();

          const favorites = JSON.parse(localStorage.getItem('favoritedTweets') || '{}');
          const feedContainer = document.getElementById('favorite-feed');
          feedContainer.innerHTML = '';

          const favoritePosts = posts.filter(post => {
            const tweetId = safeBtoa(post.username + post.content + post.created_at);
            return favorites[tweetId];
          });

          if (favoritePosts.length === 0) {
            feedContainer.innerHTML = '<p>No favorite posts yet.</p>';
            return;
          }

          favoritePosts.forEach(tweet => {
            const tweetId = safeBtoa(tweet.username + tweet.content + tweet.created_at);
            const tweetElement = document.createElement('div');
            tweetElement.classList.add('tweet');

            tweetElement.innerHTML = `
              <div class="tweet-header">
                <img src="${tweet.profile_image_url}" alt="${tweet.username}" class="profile-image">
                <strong>@${tweet.username}</strong>
              </div>
              <p>${tweet.content}</p>
              <small>${new Date(tweet.created_at).toLocaleString()}</small>
              <div class="tweet-actions">
                <i class='bx bxs-heart favorite-icon' 
                   data-id="${tweetId}" 
                   style="cursor: pointer; margin-top: 5px;"></i>
              </div>
              <hr>
            `;

            feedContainer.appendChild(tweetElement);
          });
        }

        fetchAndDisplayFavorites();
      </script>
    </div>

    <aside class="right-sidebar">
      <h3>Suggested Communities</h3>
      <div id="community-list"></div>
      <button id="load-more-btn" style="margin-top: 10px;">Load More</button>
    </aside>
  </div>

  <script src="suggestedcommunities.js"></script>
</body>
</html>
